<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Glowing background orbs -->
  <circle cx="150" cy="120" r="180" fill="#38bdf8" opacity="0.12" filter="blur(60px)" />
  <circle cx="1050" cy="480" r="220" fill="#818cf8" opacity="0.15" filter="blur(70px)" />

  <!-- Badge / Tag -->
  <g transform="translate(100, 100)">
    <rect width="280" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="22" r="6" fill="#10b981" />
    <text x="42" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1">SENIOR SOFTWARE ENGINEER</text>
  </g>

  <!-- Name -->
  <text x="100" y="230" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    Aditya Gopal Nandardhane
  </text>

  <!-- Subtitle -->
  <text x="100" y="295" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">
    Android • Kotlin Multiplatform (KMP) • Embedded &amp; IoT
  </text>

  <!-- Description -->
  <text x="100" y="360" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    6+ Years building high-scale mobile &amp; cloud systems, powering 15M+ total app downloads.
  </text>
  <text x="100" y="395" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Specialized in Jetpack Compose, KMP/CMP, ESP32 Firmware, Node.js, and High-Performance Architecture.
  </text>

  <!-- Stats Cards -->
  <g transform="translate(100, 470)">
    <!-- Stat 1 -->
    <rect width="220" height="90" rx="16" fill="#1e293b" stroke="#334155" opacity="0.8" />
    <text x="30" y="42" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">6+ Years</text>
    <text x="30" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Industry Experience</text>

    <!-- Stat 2 -->
    <g transform="translate(240, 0)">
      <rect width="220" height="90" rx="16" fill="#1e293b" stroke="#334155" opacity="0.8" />
      <text x="30" y="42" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">15M+ Users</text>
      <text x="30" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Total App Downloads</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(480, 0)">
      <rect width="220" height="90" rx="16" fill="#1e293b" stroke="#334155" opacity="0.8" />
      <text x="30" y="42" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">4.8 ★</text>
      <text x="30" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Play Store Rating</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(720, 0)">
      <rect width="240" height="90" rx="16" fill="#1e293b" stroke="#334155" opacity="0.8" />
      <text x="30" y="42" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Bengaluru, IN</text>
      <text x="30" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">adityanandardhane06@gmail.com</text>
    </g>
  </g>
</svg>
